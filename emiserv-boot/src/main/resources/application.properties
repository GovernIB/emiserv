# Execucio com a JAR Spring Boot autonom (mvn spring-boot:run / java -jar emiserv-boot.jar).
# El mòdul emiserv-boot NOMÉS es fa servir en aquest desplegament: no s'inclou a
# l'EAR de JBoss (veure el pom.xml de emiserv-ear), per la qual cosa aquest fitxer
# mai arriba al classpath de JBoss. Això permet activar Liquibase només aquí, sense
# tocar codi Java: a JBoss el valor per defecte de emiserv-persistence
# (spring.liquibase.enabled=false) és l'únic que s'aplica.
spring.liquibase.enabled=true

# Aquest fitxer tapa el d'emiserv-controller (mateix nom al classpath): cal repetir-hi el context
# path, perquè la interfície REACT està construïda per a /emiservback/reactapp.
server.servlet.context-path=/emiservback
# La galeta de sessió no viatja a les peticions d'altres llocs (protecció CSRF de l'API, a més de
# la comprovació d'Origin/Referer de BaseWebSecurityConfig). A JBoss es configura al servidor.
server.servlet.session.cookie.same-site=lax
# Origen del servidor de desenvolupament de Vite (npm run dev), permès a l'API i al retorn del login.
es.caib.emiserv.front.dev.origins=http://localhost:5173
