# Execucio com a JAR Spring Boot autonom (mvn spring-boot:run / java -jar emiserv-boot.jar).
# El mòdul emiserv-boot NOMÉS es fa servir en aquest desplegament: no s'inclou a
# l'EAR de JBoss (veure el pom.xml de emiserv-ear), per la qual cosa aquest fitxer
# mai arriba al classpath de JBoss. Això permet activar Liquibase només aquí, sense
# tocar codi Java: a JBoss el valor per defecte de emiserv-persistence
# (spring.liquibase.enabled=false) és l'únic que s'aplica.
spring.liquibase.enabled=true
