# L'esquema inicial creava core_clave_privada.passwd, però les llibreries SCSP i
# ScspCoreClavePrivadaEntity fan servir la columna password (la que tenen les instal·lacions
# actualitzades amb els scripts de versions/). Només afecta les bases de dades creades de zero
# amb Liquibase. SQL explícit: renameColumn posaria password entre cometes (paraula reservada
# per a Liquibase) i a Oracle quedaria en minúscules.
databaseChangeLog:
  - changeSet:
      id: 1762070400000-1
      author: limit
      comment: 'Columna core_clave_privada.passwd reanomenada a password'
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: core_clave_privada
            columnName: passwd
      changes:
        - sql:
            dbms: oracle,postgresql
            sql: ALTER TABLE core_clave_privada RENAME COLUMN passwd TO password
        - sql:
            dbms: hsqldb
            sql: ALTER TABLE core_clave_privada ALTER COLUMN passwd RENAME TO password
