# Consultes asíncrones dels serveis enrutadors processades com a peticions síncrones a cada cedent
# (cedents que només admeten peticions síncrones)
databaseChangeLog:
  - property:
      name: varcharUnit
      value: CHAR
      dbms: oracle
  - property:
      name: varcharUnit
      value: ''
      dbms: postgresql
  - property:
      name: varcharUnit
      value: ''
      dbms: hsqldb
  - changeSet:
      id: 1761580800000-1
      author: limit
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: ems_servei
                columnName: async_sincron
      changes:
        - addColumn:
            tableName: ems_servei
            columns:
              - column:
                  name: async_sincron
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: async_interval
                  type: INTEGER
              - column:
                  name: async_concurrencia
                  type: INTEGER
        - addColumn:
            tableName: ems_servei_ruta_desti
            columns:
              - column:
                  name: pausada
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - addColumn:
            tableName: ems_backoffice_pet
            columns:
              - column:
                  name: pausada
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - addColumn:
            tableName: ems_backoffice_sol
            columns:
              - column:
                  name: entitat_codi
                  type: varchar(64 ${varcharUnit})
              - column:
                  name: peticio_desti_id
                  type: varchar(26 ${varcharUnit})
              - column:
                  name: intents
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: data_enviament
                  type: TIMESTAMP
              - column:
                  name: data_proper_intent
                  type: TIMESTAMP
              - column:
                  name: darrer_error
                  type: varchar(4000 ${varcharUnit})
              - column:
                  name: error_codi
                  type: varchar(16 ${varcharUnit})
  - changeSet:
      id: 1761580800000-2
      author: limit
      preConditions:
        - onFail: MARK_RAN
        - not:
            - sequenceExists:
                sequenceName: ems_async_idpet_seq
      changes:
        # IdPeticion de les peticions enviades als cedents
        - createSequence:
            sequenceName: ems_async_idpet_seq
            startValue: 1
        - sql:
            dbms: oracle
            sql: GRANT SELECT ON ems_async_idpet_seq TO www_emiserv
  - changeSet:
      id: 1761580800000-3
      author: limit
